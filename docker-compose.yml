# ============================================================
# AI 内容鉴真私有化推理网关 - 一键部署
# 用法: docker compose up -d
# ============================================================
services:
  # ---------- 推理网关 ----------
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    ports:
      - "8000:8000"
    volumes:
      - ./models/weights:/app/models/weights:ro
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - auth-net
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  # ---------- Redis 缓存 & 限流 ----------
  redis:
    image: redis:7-alpine
    container_name: auth-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --save 60 1000
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - auth-net

  # ---------- Nginx 反向代理 ----------
  nginx:
    image: nginx:1.27-alpine
    container_name: auth-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - gateway
    networks:
      - auth-net

volumes:
  redis-data:

networks:
  auth-net:
    driver: bridge
